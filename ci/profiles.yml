# dbt profiles for automation (GitHub Actions sets DBT_PROFILES_DIR=ci).
#
# Two targets, both authed by the BQ_SA_KEY repo secret written to the keyfile
# path below:
#   ci   — used by CI on PRs/pushes. target.name != 'prod', so
#          generate_schema_name ignores the +schema configs and everything
#          builds into one throwaway dataset (dbt_ci), isolated from prod.
#   prod — used by the scheduled refresh. Routes models into the named contract
#          (anchor_staging / anchor_intermediate / anchor_marts / anchor_seeds).
#
# To go keyless (Workload Identity Federation) later: swap the workflow's auth
# step and change `method` to `oauth` (ADC) — no other changes here.

anchor:
  target: ci
  outputs:
    ci:
      type: bigquery
      method: service-account
      project: anchor-495115
      dataset: dbt_ci
      keyfile: /tmp/anchor-bq-key.json
      threads: 4
      location: US
    prod:
      type: bigquery
      method: service-account
      project: anchor-495115
      dataset: anchor
      keyfile: /tmp/anchor-bq-key.json
      threads: 4
      location: US
