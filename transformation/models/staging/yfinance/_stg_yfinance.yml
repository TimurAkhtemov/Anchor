version: 2

models:
  - name: stg_yfinance__tickers
    description: >
      Staged stock tickers metadata from yfinance. Grain: one row per security.
    columns:
      - name: ticker
        description: >
          Yahoo Finance symbol (e.g. AAPL, SPY). Primary key. Unique within our
          declared namespace — one security per Yahoo symbol, single source,
          US-listed config. Yahoo disambiguates foreign listings with a suffix
          (RY.TO, BMW.DE), so the symbol string itself encodes the exchange and
          no collision reaches us. NOTE: bare ticker is not a globally stable
          key — if we ever ingest multiple exchanges, the natural key becomes
          (symbol, MIC) and we'd introduce a surrogate security_id.
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: Standardized long name of the company or ETF.
      - name: sector
        description: Business sector, using yfinance/Yahoo's taxonomy (e.g. "Financial Services", "Consumer Cyclical") — not GICS names. Null for ETFs.
      - name: industry
        description: Industry group.
      - name: market_cap
        description: Current market capitalization in USD. Used to bucket holdings into cap tiers (large/mid/small). Null for ETFs.
      - name: exchange
        description: Trading exchange code.
      - name: currency
        description: Currency of price values.
      - name: quote_type
        description: >
          yfinance quoteType — EQUITY / ETF / MUTUALFUND / MONEYMARKET. The
          asset-classification spine; reliable for instrument FORM, silent on
          fund contents (hence the fund_classifications mapping).
        data_tests:
          - accepted_values:
              arguments:
                values: ['EQUITY', 'ETF', 'MUTUALFUND', 'MONEYMARKET', 'INDEX', 'CRYPTOCURRENCY']
      - name: raw_ingested_at
        description: Ingestion audit timestamp.

  - name: stg_yfinance__prices
    description: >
      Staged daily historical stock and ETF prices. Grain: one row per
      ticker per trading_date (composite primary key).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ticker
              - trading_date
    columns:
      - name: ticker
        description: Yahoo Finance symbol. FK to stg_yfinance__tickers.ticker.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_yfinance__tickers')
                field: ticker
      - name: trading_date
        description: Date of the daily price bar.
        data_tests:
          - not_null
      - name: open_price
        description: Opening price on the date.
      - name: high_price
        description: High price on the date.
      - name: low_price
        description: Low price on the date.
      - name: close_price
        description: Closing price on the date (adjusted for splits/dividends).
      - name: trading_volume
        description: Total shares traded.
      - name: raw_ingested_at
        description: Ingestion audit timestamp.
