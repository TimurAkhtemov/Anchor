version: 2

models:
  - name: ticker_trend
    description: >
      Long sparkline source — the most recent 30 trading sessions per ticker.
      Grain: one row per ticker per trading_date. The serve layer shapes these
      into a sparkline.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ticker
              - trading_date
    columns:
      - name: ticker
        description: Yahoo Finance symbol. FK to stg_yfinance__tickers.ticker.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_yfinance__tickers')
                field: ticker
      - name: trading_date
        description: Session date of the bar.
        data_tests:
          - not_null
      - name: close_price
        description: Closing price (split/dividend adjusted).

  - name: holdings_benchmarks
    description: >
      Holdings-tier mart. Each holding paired with both benchmarks (sector +
      cap-style), holding% and benchmark% computed together as one row per
      pairing, with the relative position (pp) and an ahead/behind/in_line
      label per horizon. Grain: one row per (holding_ticker, benchmark_type).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - holding_ticker
              - benchmark_type
    columns:
      - name: holding_ticker
        description: The individual holding's symbol.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_yfinance__tickers')
                field: ticker
      - name: sector
        description: Holding's live yfinance sector (Yahoo taxonomy). Sector-axis join key.
        data_tests:
          - not_null
      - name: cap_tier
        description: Derived cap tier (Large >=$10B, Mid $2-10B, Small <$2B). Cap-style-axis join key.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Large', 'Mid', 'Small']
      - name: benchmark_type
        description: Which axis this row benchmarks on.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['sector', 'cap_style']
      - name: benchmark_etf
        description: The benchmark ETF for this axis.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_yfinance__tickers')
                field: ticker
      - name: relative_1m_pp
        description: holding% - benchmark% over 1 month, in percentage points. Default-horizon relative position.
        data_tests:
          - not_null
      - name: label_1m
        description: ahead / behind / in_line over 1 month, against the inline_band_pp band.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ahead', 'behind', 'in_line']

  - name: macro_regime
    description: >
      One-row characterization of the current macro environment, synthesized
      from the rate / inflation / labor indicators. Each dimension's 3-month
      delta is classified into a directional state (tunable dead-band via the
      regime_*_threshold_pp vars). The sector tier reads this as its context
      banner. Labor: rising unemployment = loosening labor market.
    columns:
      - name: as_of_date
        description: Most recent contributing indicator date (data freshness).
        data_tests:
          - not_null
      - name: rates_state
        description: rising / easing / steady (from the fed funds 3-month delta).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['rising', 'easing', 'steady']
      - name: inflation_state
        description: rising / cooling / stable (from the YoY inflation 3-month delta).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['rising', 'cooling', 'stable']
      - name: labor_state
        description: tightening / loosening / stable (from the unemployment 3-month delta; inverted).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tightening', 'loosening', 'stable']
      - name: regime_summary
        description: One-line composite phrase the UI can render as the regime banner.
        data_tests:
          - not_null

  - name: sector_performance
    description: >
      Sector tier: each ingested SPDR sector ETF's performance plus its recent
      co-movement with the 10-year yield. Read under the macro_regime banner
      and above the holdings tier. Grain: one row per sector ETF.
    columns:
      - name: etf_ticker
        description: Sector ETF symbol. Primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_yfinance__tickers')
                field: ticker
      - name: sector
        description: Yahoo-taxonomy sector name this ETF represents.
        data_tests:
          - not_null
      - name: as_of_date
        description: Common as-of date from int_ticker_returns.
        data_tests:
          - not_null
      - name: rate_comovement_label
        description: moves with rates / moves against rates / rate-neutral, against the comovement_threshold band.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['moves with rates', 'moves against rates', 'rate-neutral']

  - name: macro_indicators
    description: >
      Macro tier display cards: one row per macro indicator with current value,
      3-month delta, direction, and FRED metadata (title/units/source_series_id)
      for the traceability footer. Grain: one row per indicator_key.
    columns:
      - name: indicator_key
        description: Stable indicator name.
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['fed_funds_rate', 'ten_year_yield', 'unemployment_rate', 'inflation_yoy']
      - name: source_series_id
        description: Originating FRED series_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fred__series')
                field: series_id
      - name: direction
        description: up / down / flat from the sign of delta_3mo.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['up', 'down', 'flat']

  - name: macro_trend
    description: >
      Macro sparkline source — trailing macro_trend_months of each indicator's
      series (inflation as the YoY trajectory). FRED analog of ticker_trend.
      Grain: one row per (indicator_key, observation_date).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - indicator_key
              - observation_date
    columns:
      - name: indicator_key
        description: Stable indicator name.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fed_funds_rate', 'ten_year_yield', 'unemployment_rate', 'inflation_yoy']
      - name: observation_date
        description: Observation date of the point.
        data_tests:
          - not_null
      - name: value
        description: Indicator value at the date (level, or YoY % for inflation).
        data_tests:
          - not_null
