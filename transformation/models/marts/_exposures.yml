version: 2

exposures:
  - name: web_dashboard
    label: Anchor Web Dashboard
    type: dashboard
    maturity: medium
    url: https://anchor-pi-five.vercel.app
    description: >
      Public Anchor web app (Next.js static export). Renders the macro, sector,
      holdings, and trend marts from the committed web bundle
      (web/public/data/anchor.json) written by app/export_web.py.
    depends_on:
      - ref('macro_indicators')
      - ref('macro_regime')
      - ref('macro_trend')
      - ref('sector_performance')
      - ref('holdings_benchmarks')
      - ref('portfolio_composition')
      - ref('ticker_trend')
      - ref('as_of_calendar')
    owner:
      name: Timur Akhtemov
      email: timur.akhtemov@gmail.com
