# CI: build + test the dbt project against BigQuery on every PR and push to main.
#
# This is the "does this change break the warehouse" gate — it compiles every
# model, runs them into an isolated throwaway dataset (dbt_ci), and runs all 118
# data tests. Green here means the gold contract still holds.
#
# Auth: reads the BigQuery service-account JSON from the BQ_SA_KEY repo secret.
# Until that secret exists the build is SKIPPED (the run stays green with a
# warning), so this groundwork doesn't leave a red X on main. Enable it with:
#   gh secret set BQ_SA_KEY < ~/.dbt/anchor-bigquery-key.json
#
# (To go keyless later, swap the "Write key" step for Workload Identity
# Federation via google-github-actions/auth and set method: oauth in ci/profiles.yml.)

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DBT_PROFILES_DIR: ci   # use ci/profiles.yml (target: ci -> dataset dbt_ci)

jobs:
  # Skip the build until the BQ secret is configured, so the workflow is green
  # (not red) in the meantime.
  guard:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          BQ_SA_KEY: ${{ secrets.BQ_SA_KEY }}
        run: |
          if [ -z "$BQ_SA_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BQ_SA_KEY secret not set — skipping dbt build. Add it to enable CI."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest deps
        run: pip install -r ingestion/requirements.txt pandas pyarrow

      - name: Run pytest
        # Pure-Python tests (CSV parsing, SnapTrade helpers, the snapshot-privacy
        # invariant against the committed parquet files) — no BigQuery, no secrets.
        run: python -m pytest tests/ -q

      - name: Install dbt
        run: pip install "dbt-bigquery~=1.11.0"

      - name: Write BigQuery key
        # via env (not inline) to avoid leaking/injecting the secret into the shell
        env:
          BQ_SA_KEY: ${{ secrets.BQ_SA_KEY }}
        run: printf '%s' "$BQ_SA_KEY" > /tmp/anchor-bq-key.json

      - name: Install dbt packages
        run: dbt deps --project-dir transformation

      - name: Build + test
        run: dbt build --project-dir transformation --target ci

  # Web tour surface (web/): typecheck + static export + Playwright smoke.
  # No secrets needed — the page renders the committed anchor.json bundle,
  # so this job runs even while the dbt build is gated on BQ_SA_KEY.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build (static export -> out/)
        # Runs first: it regenerates the gitignored next-env.d.ts that
        # `tsc --noEmit` needs on a fresh checkout.
        run: npm run build

      - name: Typecheck
        # Covers tests/ and playwright.config.ts, which are outside the
        # build's type graph.
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Smoke test (serves out/)
        run: npm run test:e2e
