# Publish the dbt docs lineage site to GitHub Pages.
#
# v1 is secret-free: it serves the committed self-contained static site at
# site/index.html (generated by `dbt docs generate --static --project-dir transformation --target prod`).
# To refresh: regenerate, copy transformation/target/static_index.html -> site/index.html,
# and push — this workflow redeploys. (A later iteration can regenerate in CI
# once the BigQuery service-account key is added as a repo secret.)
#
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".

name: Deploy dbt docs

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
