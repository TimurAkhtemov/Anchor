# Scheduled data refresh: ingest -> dbt build (prod) -> export snapshot -> commit.
#
# Runs the tool-agnostic Makefile targets (so a future Dagster/Prefect layer can
# call the same steps). Refreshes the prod marts, regenerates the committed
# parquet snapshot, and commits it back to main — which auto-redeploys the live
# Streamlit app (it reads the snapshot).
#
# DISPATCH-ONLY for now: run it manually from the Actions tab to test. When happy,
# uncomment the `schedule:` block to enable the weekday post-close cron.
#
# Secrets used: BQ_SA_KEY (BigQuery), FRED_API_KEY (FRED ingestion).

name: Refresh data

on:
  workflow_dispatch:
  # schedule:
  #   # 23:00 UTC, Mon–Fri — after the US close + EOD data settle. Adjust as needed.
  #   - cron: "0 23 * * 1-5"

# Allow the job to commit the regenerated snapshot back to the repo.
permissions:
  contents: write

env:
  DBT_PROFILES_DIR: ci   # ci/profiles.yml -> prod target (anchor_* datasets)
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/anchor-bq-key.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "dbt-bigquery~=1.11.0"
          pip install -r ingestion/requirements.txt
          pip install -r app/requirements.txt

      - name: Write BigQuery key
        env:
          BQ_SA_KEY: ${{ secrets.BQ_SA_KEY }}
        run: printf '%s' "$BQ_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Ingest bronze (FRED + yfinance)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: make ingest

      - name: Build + test prod marts
        run: make build-prod

      - name: Export snapshot
        run: make snapshot

      - name: Commit refreshed snapshot
        run: |
          git config user.name "anchor-refresh-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/snapshot
          if git diff --cached --quiet; then
            echo "No snapshot changes — marts unchanged since last refresh."
          else
            git commit -m "chore: scheduled snapshot refresh [skip ci]"
            git push
          fi
