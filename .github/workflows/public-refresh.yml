# Weekday public refresh: ingest -> dbt build (prod) -> briefing -> export -> web build
# + browser tests -> one commit touching only the bundle. Vercel deploys from that commit.
#
# The logic lives in the Makefile and scripts/public_refresh.py; this file is a trigger.
# Demo world only: the credential is the narrow public service account.
#
# 02:45 UTC Tue-Sat = 21:45 EST / 22:45 EDT on Mon-Fri evenings, past the 21:30 ET settle.
# Commits made with GITHUB_TOKEN do not trigger other workflows, so this job validates
# the bundle and runs the web build + tests itself before committing.

name: Public refresh

on:
  schedule:
    - cron: '45 2 * * 2-6'
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the refreshed bundle (false = dry run, nothing is committed)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: public-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # absolute: the Makefile runs dbt from transformation/, so a relative path would miss
      DBT_PROFILES_DIR: ${{ github.workspace }}/orchestration/dbt_profiles
      # Secrets are step-scoped, on the Python steps that need them: npm install scripts
      # and Playwright below must never see them.
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/anchor-bq-key.json
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt -r orchestration/requirements.txt

      - name: Write BigQuery key
        # via env (not inline) to avoid leaking/injecting the secret into the shell
        env:
          BQ_SA_KEY: ${{ secrets.BQ_SA_KEY }}
        run: printf '%s' "$BQ_SA_KEY" > /tmp/anchor-bq-key.json

      - name: Ingest FRED + yfinance (demo world)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: make ingest

      - name: dbt build (prod)
        env:
          BQ_SA_KEY: ${{ secrets.BQ_SA_KEY }}  # read by the dbt profile
        run: make build-prod DBT=dbt

      - name: Briefing + export + validate
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANCHOR_BRIEFING_PROVIDER: anthropic
        run: make public-refresh

      - name: Remove BigQuery key
        # before any Node step: npm install scripts and Playwright must not find it
        if: always()
        run: rm -f /tmp/anchor-bq-key.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Commit bundle
        if: steps.refresh.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          AS_OF: ${{ steps.refresh.outputs.as_of }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/anchor.json
          git commit -m "chore(data): refresh public bundle to ${AS_OF}"
          git push
