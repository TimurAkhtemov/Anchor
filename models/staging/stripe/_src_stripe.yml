version: 2

sources:
  - name: stripe
    database: dbt-tutorial
    tables:
      - name: payment
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: id
            data_type: int64
          - name: orderid
            data_type: int64
          - name: paymentmethod
            data_type: string
          - name: status
            data_type: string
          - name: amount
            data_type: int64
          - name: created
            data_type: date
          - name: _batched_at
            data_type: datetime
