version: 2

models:
  - name: int_ticker_returns
    description: >
      Per-ticker scalar returns for every ticker (holdings + benchmark ETFs),
      measured to a single common as-of date so any holding and its benchmark
      are compared over the identical window. Grain: one row per ticker.
    columns:
      - name: ticker
        description: Yahoo Finance symbol. Primary key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_yfinance__tickers')
                field: ticker
      - name: as_of_date
        description: Common as-of date — max(trading_date) across the market calendar. Same for every row.
        data_tests:
          - not_null
      - name: latest_close
        description: Close on the as-of date.
      - name: daily_return_pct
        description: Percent change, as-of date vs prior trading session.
      - name: return_1m_pct
        description: Percent change vs ~1 month ago (21 trading sessions back).
      - name: return_ytd_pct
        description: Percent change vs the last close of the previous calendar year.
      - name: return_1y_pct
        description: Percent change vs ~1 year ago (252 trading sessions back).

  - name: int_macro_indicators
    description: >
      FRED macro series normalized into one uniform row per indicator: current
      value, value 3 months ago, and the 3-month delta. Mixed-frequency safe
      (calendar-date anchors, as-of values). Inflation is the derived CPI YoY
      rate; level series pass through. Grain: one row per indicator_key.
    columns:
      - name: indicator_key
        description: Stable indicator name (fed_funds_rate, ten_year_yield, unemployment_rate, inflation_yoy).
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['fed_funds_rate', 'ten_year_yield', 'unemployment_rate', 'inflation_yoy']
      - name: source_series_id
        description: Originating FRED series_id (traceability footer).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fred__series')
                field: series_id
      - name: as_of_date
        description: Latest observation date for the source series.
        data_tests:
          - not_null
      - name: current_value
        description: Current value — level (%) for rate/labor series, YoY rate (%) for inflation.
      - name: value_3mo_ago
        description: Same metric as of ~3 months before the as-of date.
      - name: delta_3mo
        description: current_value - value_3mo_ago, in percentage points.
